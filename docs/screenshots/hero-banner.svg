<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="40%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c1438"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGradient)"/>

  <!-- Subtle Circuit Matrix Grid Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M 0,70 L 1200,70 M 0,140 L 1200,140 M 0,210 L 1200,210 M 0,280 L 1200,280 M 0,350 L 1200,350" />
    <path d="M 120,0 L 120,420 M 240,0 L 240,420 M 360,0 L 360,420 M 480,0 L 480,420 M 600,0 L 600,420 M 720,0 L 720,420 M 840,0 L 840,420 M 960,0 L 960,420 M 1080,0 L 1080,420" />
  </g>

  <!-- Decorative Cryptographic Circuit Traces -->
  <g opacity="0.35" stroke="url(#cyanPurpleGrad)" stroke-width="2" fill="none">
    <path d="M 100,210 L 180,210 L 220,150 L 320,150" />
    <circle cx="320" cy="150" r="4" fill="#06b6d4" />
    <path d="M 100,280 L 160,280 L 200,330 L 300,330" />
    <circle cx="300" cy="330" r="4" fill="#8b5cf6" />
    
    <path d="M 1100,210 L 1020,210 L 980,150 L 880,150" />
    <circle cx="880" cy="150" r="4" fill="#ec4899" />
    <path d="M 1100,280 L 1040,280 L 1000,330 L 900,330" />
    <circle cx="900" cy="330" r="4" fill="#3b82f6" />
  </g>

  <!-- Center Shield Icon -->
  <g transform="translate(600, 115)">
    <!-- Outer Glow -->
    <path d="M 0,-45 C 30,-45 45,-35 45,-10 C 45,30 15,55 0,65 C -15,55 -45,30 -45,-10 C -45,-35 -30,-45 0,-45 Z" 
          fill="none" stroke="url(#cyanPurpleGrad)" stroke-width="3" filter="url(#glow)" />
    
    <!-- Solid Shield -->
    <path d="M 0,-42 C 28,-42 42,-32 42,-8 C 42,28 14,52 0,60 C -14,52 -42,28 -42,-8 C -42,-32 -28,-42 0,-42 Z" 
          fill="url(#shieldGrad)" />

    <!-- Center Keyhole / ZK Node Symbol -->
    <circle cx="0" cy="-5" r="9" fill="#070b14" stroke="#38bdf8" stroke-width="2" />
    <path d="M -4,-3 L 4,-3 L 6,18 L -6,18 Z" fill="#070b14" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="7" r="3" fill="#38bdf8" />
  </g>

  <!-- Main Title -->
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="2" fill="#ffffff">
    LEX<tspan fill="#38bdf8">VAULT</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="275" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5" fill="#94a3b8">
    ZERO-KNOWLEDGE, BLOCKCHAIN-POWERED EVIDENCE VAULT
  </text>

  <!-- Mission Statement Pill -->
  <g transform="translate(600, 318)">
    <rect x="-430" y="-18" width="860" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">
      Privacy-Preserving Digital Forensics &amp; Chain of Custody via Groth16 zk-SNARKs &amp; Ethereum
    </text>
  </g>

  <!-- Cryptographic Feature Badges -->
  <g transform="translate(600, 375)">
    <!-- Badge 1: Groth16 -->
    <g transform="translate(-320, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#a5b4fc">Groth16 zk-SNARK</text>
    </g>

    <!-- Badge 2: Poseidon Merkle -->
    <g transform="translate(-160, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#082f49" stroke="#0284c7" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#7dd3fc">Poseidon Merkle</text>
    </g>

    <!-- Badge 3: Solidity Ledger -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#6ee7b7">Solidity Ledger</text>
    </g>

    <!-- Badge 4: AES-256-GCM -->
    <g transform="translate(160, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#4a044e" stroke="#c026d3" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#f0abfc">AES-256-GCM</text>
    </g>

    <!-- Badge 5: 2-of-3 Shamir -->
    <g transform="translate(320, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#c7d2fe">2-of-3 Shamir SSSS</text>
    </g>
  </g>
</svg>
