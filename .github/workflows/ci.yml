name: LexVault CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build, Test & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Compile Smart Contracts
        run: npx hardhat compile

      - name: Run Smart Contract Tests
        run: npm run test:contracts

      - name: Run Circom Circuit Tests
        run: npm run test:circuit

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend for Production
        working-directory: ./frontend
        run: npm run build

      - name: Build Showcase Bundle
        run: npm run build:showcase
        env:
          VITE_SHOWCASE_MODE: "true"
          VITE_BASE_PATH: /LexVault/

      - name: Run Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Automated Secret & Repository Security Scan
        run: |
          npm run scan:public
          npm run scan:git

      - name: Verify Documentation Links, Brand Integrity & Assets
        run: npm run verify:repo

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Verify Showcase Runtime Zero-Network Purity
        run: npm run test:showcase-network
